<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ХС Портал | Полная версия</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #07070a;
            --bg-card: rgba(15, 15, 20, 0.75);
            --accent-primary: #ffffff;
            --accent-secondary: #8a8a9e;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border: rgba(255, 255, 255, 0.06);
            --font-family: 'Inter', sans-serif;
            --neon-color: #ff6b35;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-family);
            padding: 2rem 1rem 4rem;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: var(--bg-image, none); background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 0.15; pointer-events: none; z-index: 0; }
        
        .particle {
            position: fixed;
            top: -20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: particleFall linear forwards;
        }
        @keyframes particleFall {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(var(--moveX)); opacity: 0; }
        }
        
        .fall-effect {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 9999;
            animation: fallLinear forwards;
        }
        @keyframes fallLinear {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        
        .card.neon-glow, .game-card.neon-glow, .gallery-post.neon-glow { box-shadow: 0 0 20px var(--neon-color); transition: box-shadow 0.3s ease; }
        .container { max-width: 1300px; margin: 0 auto; position: relative; z-index: 10; }
        .header { text-align: center; margin-bottom: 4rem; padding: 1rem 0; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .logo-container { display: flex; justify-content: center; align-items: center; }
        .site-logo { max-width: 80px; max-height: 80px; border-radius: 1rem; object-fit: contain; }
        .header h1 { font-size: 4.5rem; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; display: inline-block; }
        .header p { font-size: 1.2rem; color: var(--text-secondary); }
        .typewriter-text { overflow: hidden; border-right: 2px solid var(--accent-primary); white-space: nowrap; margin: 0 auto; animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite; }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink-caret { from, to { border-color: transparent; } 50% { border-color: var(--accent-primary); } }
        .main-tabs { display: flex; gap: 0.8rem; margin-bottom: 3rem; justify-content: center; flex-wrap: wrap; }
        .main-tab-btn { background: transparent; border: 1px solid var(--border); padding: 0.7rem 1.8rem; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-radius: 2rem; transition: all 0.3s; backdrop-filter: blur(4px); }
        .main-tab-btn.active, .main-tab-btn:hover { background: rgba(255, 255, 255, 0.05); color: white; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .tab-pane { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .card, .game-card, .gallery-post { background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 1.5rem; padding: 1.2rem; border: 1px solid var(--border); transition: all 0.3s; text-decoration: none; color: inherit; cursor: pointer; }
        .card:hover, .game-card:hover, .gallery-post:hover { transform: translateY(-4px) rotateX(2deg); background: rgba(20, 20, 28, 0.85); border-color: rgba(255, 255, 255, 0.15); }
        .card { display: flex; align-items: center; gap: 1rem; }
        .card-icon { font-size: 2rem; min-width: 50px; text-align: center; color: var(--text-secondary); }
        .game-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.5rem; }
        .game-title { font-weight: 600; font-size: 1.1rem; color: var(--text-primary); }
        .game-controls { display: flex; gap: 0.5rem; }
        .game-controls button { background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 1rem; padding: 0.2rem 0.6rem; color: var(--text-primary); cursor: pointer; font-size: 0.7rem; }
        .game-controls button:hover { background: var(--accent-primary); color: #0f0f11; }
        .gallery-post-image { width: 100%; max-height: 300px; object-fit: contain; border-radius: 1rem; margin: 0.5rem 0; background: #000; }
        .gallery-actions { display: flex; gap: 1rem; margin-top: 0.5rem; }
        .gallery-actions button { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; }
        .gallery-actions button:hover { color: var(--accent-primary); }
        .post-form { background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 1.5rem; padding: 1.2rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .post-form input, .post-form textarea { width: 100%; margin-bottom: 0.8rem; padding: 0.8rem; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 1rem; color: var(--text-primary); font-family: var(--font-family); }
        .message-reactions { display: flex; gap: 0.5rem; margin-top: 0.3rem; }
        .reaction-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.8rem; }
        .reaction-btn:hover { color: var(--accent-primary); }
        .favorite-btn { color: gold; }
        .slide-toggle { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); color: var(--text-primary); font-weight: 500; padding: 0.8rem 1.2rem; width: 100%; text-align: left; border-radius: 1.5rem; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .slide-toggle:hover { background: rgba(255, 255, 255, 0.08); }
        .slide-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: rgba(0, 0, 0, 0.3); border-radius: 0 0 1.5rem 1.5rem; }
        .slide-content.open { max-height: 400px; padding: 1rem; }
        .btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); padding: 0.6rem 1.2rem; border-radius: 2rem; color: var(--text-primary); font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
        .btn-outline { background: transparent; }
        .admin-panel { margin-top: 3rem; background: var(--bg-card); backdrop-filter: blur(20px); border-radius: 1.5rem; padding: 1.5rem; border: 1px solid var(--border); display: none; }
        .admin-panel.show { display: block; }
        .tabs-admin { display: flex; gap: 0.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; }
        .admin-tab-btn { background: transparent; border: none; padding: 0.4rem 1rem; border-radius: 2rem; color: var(--text-secondary); cursor: pointer; }
        .admin-tab-btn.active { background: rgba(255, 255, 255, 0.1); color: white; }
        .admin-panel input, .admin-panel select, .admin-panel textarea { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border); border-radius: 1rem; padding: 0.6rem; color: var(--text-primary); font-family: var(--font-family); margin: 0.3rem 0; width: 100%; }
        .admin-panel .list-item { background: rgba(0, 0, 0, 0.4); margin: 0.3rem 0; padding: 0.5rem; border-radius: 0.8rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); flex-wrap: wrap; gap: 0.5rem; }
        .three-dots { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .dots-btn { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border); width: 45px; height: 45px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); transition: all 0.3s; }
        .dots-btn:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.02); }
        .dots-dropdown { position: absolute; top: 55px; right: 0; background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 1rem; padding: 0.5rem; min-width: 240px; display: none; flex-direction: column; gap: 0.3rem; z-index: 1001; }
        .dots-dropdown.show { display: flex; }
        .dots-dropdown button { background: transparent; border: none; padding: 0.5rem 0.8rem; text-align: left; color: var(--text-secondary); cursor: pointer; border-radius: 0.6rem; display: flex; align-items: center; gap: 8px; }
        .dots-dropdown button:hover { background: rgba(255, 255, 255, 0.08); color: white; }
        .dots-dropdown button.active { color: var(--accent-primary); background: rgba(255, 255, 255, 0.05); }
        .music-player, .visitor-counter { position: fixed; bottom: 20px; left: 20px; background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 2rem; padding: 0.4rem 1rem; border: 1px solid var(--border); z-index: 1000; display: flex; gap: 0.5rem; align-items: center; font-size: 0.8rem; }
        .visitor-counter { left: auto; right: 20px; cursor: pointer; }
        .editor-toolbar { position: fixed; bottom: 80px; right: 20px; z-index: 1000; display: none; gap: 0.5rem; }
        .editor-toolbar.show { display: flex; }
        .css-editor { margin-top: 1rem; }
        .css-editor textarea { width: 100%; height: 200px; font-family: monospace; background: #0a0a0e; color: #fff; border: 1px solid var(--border); border-radius: 1rem; padding: 0.8rem; }
        [contenteditable="true"] { outline: 1px dashed rgba(255,255,255,0.3); padding: 0.1rem; border-radius: 0.3rem; }
        .footer { text-align: center; margin-top: 3rem; font-size: 0.7rem; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 1.5rem; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: var(--bg-card); backdrop-filter: blur(20px); padding: 2rem; border-radius: 1.5rem; width: 320px; text-align: center; border: 1px solid var(--border); }
        @media (max-width: 700px) { .cards-grid { grid-template-columns: 1fr; } .header h1 { font-size: 2.2rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-container" id="logoContainer"></div>
        <h1 id="siteTitle">ХС Портал</h1>
        <p id="siteDesc">Модульная система | Стиль + Функции</p>
    </div>
    <div class="main-tabs">
        <button class="main-tab-btn active" data-tab="links">📁 Ссылки</button>
        <button class="main-tab-btn" data-tab="games">🎮 Игры</button>
        <button class="main-tab-btn" data-tab="gallery">🖼 Галерея</button>
        <button class="main-tab-btn" data-tab="community">💬 Чат</button>
    </div>
    <div id="linksTab" class="tab-pane active"><div class="tabs" id="tabsContainer"></div><div class="cards-grid" id="cardsContainer"></div></div>
    <div id="gamesTab" class="tab-pane"><div class="cards-grid" id="gamesContainer"></div></div>
    <div id="galleryTab" class="tab-pane">
        <div class="post-form"><input type="text" id="galleryName" placeholder="Ваше имя"><textarea id="galleryDesc" rows="2" placeholder="Описание..."></textarea><input type="file" id="galleryFile" accept="image/*"><button id="publishGalleryBtn" class="btn">📤 Опубликовать</button></div>
        <div class="cards-grid" id="galleryContainer">Загрузка...</div>
    </div>
    <div id="communityTab" class="tab-pane">
        <div class="slide-form-container"><button class="slide-toggle" id="slideToggleBtn"><i class="fas fa-comment-dots"></i> Нажми, чтобы написать сообщение</button><div class="slide-content" id="slideContent"><div class="post-form" style="margin:0;padding:0;"><input type="text" id="communityName" placeholder="Ваше имя"><textarea id="communityMsg" rows="2" placeholder="Сообщение"></textarea><input type="text" id="communityMedia" placeholder="Ссылка на медиа"><button id="publishPostBtn" class="btn">Отправить</button></div></div></div>
        <div id="communityPosts" style="background:var(--bg-card);border-radius:1rem;padding:1rem;">Загрузка...</div>
    </div>
    <div class="footer"><button id="adminLoginBtn" class="btn-outline btn">🔒 Админ</button></div>
</div>

<!-- ТРИ ТОЧКИ -->
<div class="three-dots">
    <button class="dots-btn" id="dotsBtn">⋮</button>
    <div class="dots-dropdown" id="dotsDropdown">
        <button id="effectParticlesBtn"><i class="fas fa-circle"></i> <span>Плавающие частицы</span> <span class="indicator"></span></button>
        <button id="effectNeonBtn"><i class="fas fa-lightbulb"></i> <span>Неоновое свечение</span> <span class="indicator"></span></button>
        <button id="effect3DBtn"><i class="fas fa-cube"></i> <span>3D эффект</span> <span class="indicator"></span></button>
        <button id="effectTypewriterBtn"><i class="fas fa-keyboard"></i> <span>Печатный текст</span> <span class="indicator"></span></button>
        <button id="effectDarkLightBtn"><i class="fas fa-moon"></i> <span>Светлая/тёмная тема</span> <span class="indicator"></span></button>
        <hr>
        <button id="effectRainBtn"><i class="fas fa-cloud-rain"></i> <span>Дождь</span> <span class="indicator"></span></button>
        <button id="effectRedRainBtn"><i class="fas fa-cat"></i> <span>Рыжий дождь</span> <span class="indicator"></span></button>
        <button id="effectSnowBtn"><i class="fas fa-snowflake"></i> <span>Снег</span> <span class="indicator"></span></button>
        <button id="effectStarsBtn"><i class="fas fa-star"></i> <span>Звездопад</span> <span class="indicator"></span></button>
        <button id="effectLeavesBtn"><i class="fas fa-leaf"></i> <span>Листопад</span> <span class="indicator"></span></button>

        <button id="effectFireBtn"><i class="fas fa-fire"></i> <span>Огонь</span> <span class="indicator"></span></button>
        <button id="effectGradientBtn"><i class="fas fa-palette"></i> <span>Градиент фон</span> <span class="indicator"></span></button>
        <button id="clearEffectsBtn"><i class="fas fa-eraser"></i> <span>Очистить всё</span></button>
        <hr><button id="toggleMusicBtn"><i class="fas fa-music"></i> <span>Музыка вкл/выкл</span> <span class="indicator"></span></button>
        <button id="closeDotsBtn"><i class="fas fa-times"></i> Закрыть</button>
    </div>
</div>

<div class="music-player" id="musicPlayer"><i class="fas fa-play" id="musicIcon"></i> <span id="musicStatus">Выкл</span></div>
<div class="visitor-counter" id="visitorCounter"><i class="fas fa-chart-line"></i> 👥 <span id="visitorCountDisplay">0</span></div>
<div class="editor-toolbar" id="editorToolbar"><button class="btn" id="saveEditBtn">💾 Сохранить текст</button><button class="btn-outline btn" id="exitEditBtn">✖️ Выйти</button></div>

<!-- АДМИН-ПАНЕЛЬ -->
<div class="admin-panel" id="adminPanel">
    <div class="tabs-admin">
        <button class="admin-tab-btn active" data-tab="links">📁 Ссылки</button>
        <button class="admin-tab-btn" data-tab="games">🎮 Игры</button>
        <button class="admin-tab-btn" data-tab="gallery">🖼 Галерея</button>
        <button class="admin-tab-btn" data-tab="editor">✏️ Редактор</button>
        <button class="admin-tab-btn" data-tab="design">🎨 Дизайн</button>

    <div id="adminGames" class="admin-tab-pane">

    <div id="adminGallery" class="admin-tab-pane"><div id="moderateGalleryList"></div></div>
    <div id="adminEditor" class="admin-tab-pane">
        <button id="enableEditModeBtn" class="btn">Включить редактирование текста</button>
        <button id="disableEditModeBtn" class="btn-outline btn">Выключить</button>
        <button id="saveContentBtn" class="btn">Сохранить текст</button><hr>
        <div><label>Логотип:</label><input type="file" id="logoUpload" accept="image/*"><button id="setLogoBtn" class="btn">Установить логотип</button></div>
        <div><label>Фоновое изображение:</label><input type="file" id="bgImageUpload" accept="image/*"><button id="setBgImageBtn" class="btn">Установить фон</button></div>
        <button id="resetMediaBtn" class="btn-outline btn">Сбросить логотип и фон</button><hr>
        <button id="resetAllBtn" class="btn-outline btn">Сбросить всё</button>
    </div>
    <div id="adminDesign" class="admin-tab-pane">
        <label>Фон страницы: <input type="color" id="bgPrimary" value="#07070a"></label>
        <label>Цвет неона: <input type="color" id="neonColor" value="#ff6b35"></label>
        <button id="saveDesignBtn" class="btn">Сохранить дизайн</button>
        <button id="resetDesignBtn" class="btn-outline btn">Сбросить</button>
    </div>
    <div id="adminCssEditor" class="admin-tab-pane">
        <div class="css-editor"><label>Редактор CSS:</label><textarea id="customCss" placeholder="body { background: red; }"></textarea><button id="applyCssBtn" class="btn">Применить CSS</button><button id="resetCssBtn" class="btn-outline btn">Сбросить CSS</button></div>
    </div>
    <div id="adminPassword" class="admin-tab-pane">
        <input type="password" id="newAdminPass" placeholder="Новый пароль"><button id="changePassBtn" class="btn">Сменить пароль</button>
    </div>
</div>

<script>
// ========== НАСТРОЙКИ ==========
let ADMIN_PASSWORD = "XC1412078GG";
let gradientActive = false;
let galleryImagesCache = [];
let globalSettings = { 
    tabs: [], 
    cards: [], 
    games: [], 
    design: { bgPrimary: "#07070a", neonColor: "#ff6b35" }, 
    logo: null, 
    bgImage: null 
};
let visitorCount = 0;
let customCss = "";
let gamePauseStates = {};

// Эффекты состояния
let effectsState = {
    particles: true, neon: false, effect3D: false, typewriter: false, darkTheme: true,
    rain: false, redRain: false, snow: false, stars: false, leaves: false, bubbles: false, fire: false, gradient: false, music: false
};
let particlesInterval = null, effectIntervals = {};

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaGZuhpqZ4xNLnu3rFDuG9TlMpaHuMqhMGWA002z_xXU0EdPf-zdtMO-Dg7iF56baL/exec";

// ========== ЗАГРУЗКА И СОХРАНЕНИЕ ДАННЫХ ==========
async function loadGlobalData() {
    try {
        const response = await fetch(APPS_SCRIPT_URL + "?type=settings");
        const data = await response.json();
        if(data && data.length > 0) {
            const settings = data[0];
            globalSettings.tabs = settings.tabs ? JSON.parse(settings.tabs) : [{ id: "tab1", name: "✨ Главное" }];
            globalSettings.cards = settings.cards ? JSON.parse(settings.cards) : [];
            globalSettings.games = settings.games ? JSON.parse(settings.games) : [];
            globalSettings.design = settings.design ? JSON.parse(settings.design) : { bgPrimary: "#07070a", neonColor: "#ff6b35" };
            globalSettings.logo = settings.logo || null;
            globalSettings.bgImage = settings.bgImage || null;
        } else {
            globalSettings.tabs = [{ id: "tab1", name: "✨ Главное" }];
            globalSettings.cards = [];
            globalSettings.games = [];
            await saveGlobalData();
        }
        applyDesign();
        applyMedia();
        renderLinks();
        renderGames();
    } catch(e) { console.error("Ошибка загрузки", e); }
}

async function saveGlobalData() {
    try {
        await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'settings',
                tabs: JSON.stringify(globalSettings.tabs),
                cards: JSON.stringify(globalSettings.cards),
                games: JSON.stringify(globalSettings.games),
                design: JSON.stringify(globalSettings.design),
                logo: globalSettings.logo || '',
                bgImage: globalSettings.bgImage || '',
                date: new Date().toISOString()
            })
        });
    } catch(e) { console.error("Ошибка сохранения", e); }
}

// ========== ССЫЛКИ ==========
function renderLinks() {
    const tc = document.getElementById('tabsContainer');
    const cc = document.getElementById('cardsContainer');
    if(!tc) return;
    
    tc.innerHTML = '';
    let activeTabId = localStorage.getItem('activeTabId') || (globalSettings.tabs[0]?.id || "tab1");
    
    globalSettings.tabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'main-tab-btn';
        btn.innerText = tab.name;
        if(activeTabId === tab.id) btn.classList.add('active');
        btn.onclick = () => {
            localStorage.setItem('activeTabId', tab.id);
            renderLinks();
        };
        tc.appendChild(btn);
    });
    
    const activeCards = globalSettings.cards.filter(c => c.tabId === activeTabId);
    cc.innerHTML = '';
    activeCards.forEach(card => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = card.url;
        a.target = "_blank";
        a.innerHTML = `<div class="card-icon"><i class="${card.icon || 'fa-solid fa-link'}"></i></div><div><div class="card-title">${escapeHtml(card.title)}</div></div>`;
        cc.appendChild(a);
    });
    
    renderAdminTabsCards();
}

function renderAdminTabsCards() {
    const tabList = document.getElementById('tabList');
    const cardsList = document.getElementById('cardsList');
    const cardSelect = document.getElementById('cardTabSelect');
    
    if(tabList) {
        tabList.innerHTML = '';
        globalSettings.tabs.forEach(tab => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>📁 ${escapeHtml(tab.name)}</span><button class="btn-outline btn del-tab" data-id="${tab.id}">🗑</button>`;
            tabList.appendChild(div);
        });
        document.querySelectorAll('.del-tab').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                globalSettings.tabs = globalSettings.tabs.filter(t => t.id !== id);
                globalSettings.cards = globalSettings.cards.filter(c => c.tabId !== id);
                saveGlobalData();
                renderLinks();
            };
        });
    }
    
    if(cardsList) {
        cardsList.innerHTML = '';
        globalSettings.cards.forEach(card => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<div><strong>${escapeHtml(card.title)}</strong><br><small>${card.url}</small></div><button class="btn-outline btn del-card" data-id="${card.id}">🗑</button>`;
            cardsList.appendChild(div);
        });
        document.querySelectorAll('.del-card').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                globalSettings.cards = globalSettings.cards.filter(c => c.id !== id);
                saveGlobalData();
                renderLinks();
            };
        });
    }
    
    if(cardSelect) {
        cardSelect.innerHTML = '';
        globalSettings.tabs.forEach(tab => {
            const opt = document.createElement('option');
            opt.value = tab.id;
            opt.innerText = tab.name;
            cardSelect.appendChild(opt);
        });
    }
}

document.getElementById('addTabBtn')?.addEventListener('click', () => {
    let name = document.getElementById('newTabName').value.trim();
    if(name) {
        globalSettings.tabs.push({ id: Date.now() + "", name });
        saveGlobalData();
        renderLinks();
        document.getElementById('newTabName').value = '';
    }
});

document.getElementById('addCardBtn')?.addEventListener('click', () => {
    let tabId = document.getElementById('cardTabSelect').value;
    let title = document.getElementById('newCardTitle').value.trim();
    let url = document.getElementById('newCardUrl').value.trim();
    let icon = document.getElementById('newCardIcon').value.trim();
    if(title && url) {
        globalSettings.cards.push({
            id: Date.now() + "",

            url: url,
            icon: icon || "fa-solid fa-link"
        });

        document.getElementById('newCardUrl').value = '';

// ========== ИГРЫ ==========
function renderGames() {
    const cont = document.getElementById('gamesContainer');
    if(!cont) return;
    cont.innerHTML = '';
    globalSettings.games.forEach(game => {
        if(game.enabled === false) return;
        const card = document.createElement('div');
        card.className = 'game-card';
        card.setAttribute('data-game-id', game.id);
        card.innerHTML = `<div class="game-header"><span class="game-title">${escapeHtml(game.name)}</span><div class="game-controls"><button class="pause-game-btn" data-id="${game.id}">⏸️</button></div></div><div class="game-play" style="min-height:200px;"></div>`;
        cont.appendChild(card);
        const area = card.querySelector('.game-play');
        if(game.type === 'minesweeper') initMinesweeper(area, game.settings, game.id);
        else if(game.type === 'tictactoe') initTicTacToe(area, game.settings, game.id);
        else if(game.type === 'game2048') init2048(area, game.id);
        else if(game.type === 'quiz') initQuiz(area, game.settings, game.id);
        else if(game.type === 'pong') initPong(area, game.id);
        else if(game.type === 'clicker') initClicker(area, game.id);
        else if(game.type === 'tetris') initTetris(area, game.id);
    });
    document.querySelectorAll('.pause-game-btn').forEach(btn => {
        btn.onclick = () => { toggleGamePause(btn.dataset.id); };
    });
    renderGamesList();
}

function renderGamesList() {
    const list = document.getElementById('gamesList');
    if(!list) return;
    list.innerHTML = '';
    globalSettings.games.forEach(g => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<span>${escapeHtml(g.name)} (${g.type})</span><div><button class="btn-outline btn toggle-enable-game" data-id="${g.id}" style="background:${g.enabled === false ? '#dc2626' : '#4caf50'}; color:white; margin-right:0.3rem;">${g.enabled === false ? '🔴 ВЫКЛ' : '🟢 ВКЛ'}</button><button class="btn-outline btn del-game" data-id="${g.id}">🗑</button></div>`;
        list.appendChild(div);
    });
    document.querySelectorAll('.toggle-enable-game').forEach(btn => {
        btn.onclick = () => {
            const id = btn.dataset.id;
            const game = globalSettings.games.find(g => g.id === id);
            if(game) {
                game.enabled = game.enabled === false ? true : false;
                saveGlobalData();
                renderGames();
            }
        };
    });
    document.querySelectorAll('.del-game').forEach(btn => {
        btn.onclick = () => {
            globalSettings.games = globalSettings.games.filter(g => g.id !== btn.dataset.id);
            saveGlobalData();
            renderGames();
        };
    });
}

document.getElementById('addGameBtn')?.addEventListener('click', () => {
    let name = document.getElementById('newGameName').value.trim();
    if(!name) return;
    let type = document.getElementById('gameType').value;
    let settings = {};
    if(type === 'minesweeper') {
        let s = prompt("Размер поля 6-12", "8");
        settings = { size: parseInt(s) || 8, mines: parseInt(prompt("Количество мин", Math.floor((s||8)*(s||8)*0.15))) };
    }
    if(type === 'tictactoe') settings = { size: parseInt(prompt("3 или 4", "3")) || 3 };
    if(type === 'quiz') {
        let qs = [];
        let cnt = prompt("Сколько вопросов?", "2");
        for(let i = 0; i < cnt; i++) {
            let q = prompt(`Вопрос ${i+1}`);
            let opts = prompt("Варианты через запятую").split(',');
            let cor = prompt("Правильный ответ");
            qs.push({ question: q, options: opts, correct: cor });
        }
        settings.questions = qs;
    }
    if(type === 'clicker') settings = { targetScore: parseInt(prompt("Цель очков", "10")), time: parseInt(prompt("Время сек", "15")) };
    globalSettings.games.push({ id: Date.now() + "", name, type, settings, enabled: true });
    saveGlobalData();
    renderGames();
    document.getElementById('newGameName').value = '';
});

// ========== ОСТАЛЬНЫЕ ФУНКЦИИ ==========
function applyDesign() { 
    document.documentElement.style.setProperty('--bg-dark', globalSettings.design.bgPrimary); 
    document.getElementById('bgPrimary').value = globalSettings.design.bgPrimary;
    document.documentElement.style.setProperty('--neon-color', globalSettings.design.neonColor);
    document.getElementById('neonColor').value = globalSettings.design.neonColor;
    updateNeonColor();
}

function applyMedia() {
    const lc = document.getElementById('logoContainer');
    if(globalSettings.logo && globalSettings.logo.startsWith('data:image')) {
        lc.innerHTML = `<img src="${globalSettings.logo}" class="site-logo">`;
    } else {
        lc.innerHTML = '';
    }
    if(globalSettings.bgImage && globalSettings.bgImage.startsWith('data:image')) {
        document.documentElement.style.setProperty('--bg-image', `url(${globalSettings.bgImage})`);
    } else {
        document.documentElement.style.setProperty('--bg-image', 'none');
    }
}

function updateNeonColor() {
    let color = globalSettings.design.neonColor;
    document.documentElement.style.setProperty('--neon-color', color);
    if(effectsState.neon) {
        document.querySelectorAll('.card, .game-card, .gallery-post').forEach(el => {
            el.style.setProperty('--neon-color', color);
        });
    }
}

// ========== ГАЛЕРЕЯ ==========
async function loadGallery() {
    try {
        const r = await fetch(APPS_SCRIPT_URL + "?type=gallery");
        const data = await r.json();
        const cont = document.getElementById('galleryContainer');
        if(!cont) return;
        cont.innerHTML = '';
        if(!data || !data.length) {
            cont.innerHTML = '<div>Нет картинок</div>';
            galleryImagesCache = [];
            return;
        }
        galleryImagesCache = [];
        data.slice().reverse().forEach(p => {
            if(p.imageData) galleryImagesCache.push(p.imageData);
            const card = document.createElement('div');
            card.className = 'gallery-post';
            card.innerHTML = `<img src="${p.imageData}" class="gallery-post-image" onclick="window.open(this.src,'_blank')"><div><strong>${escapeHtml(p.author)}</strong></div><div>${escapeHtml(p.desc)}</div><div class="gallery-actions"><button class="gallery-like"><i class="far fa-heart"></i> <span class="like-count">${p.likes||0}</span></button><button class="gallery-download"><i class="fas fa-download"></i> Скачать</button></div><div style="font-size:0.7rem;">📅 ${new Date(p.date).toLocaleString()}</div>`;
            cont.appendChild(card);
        });
        document.querySelectorAll('.gallery-download').forEach((btn, i) => {
            btn.onclick = () => {
                let a = document.createElement('a');
                a.href = data.slice().reverse()[i].imageData;
                a.download = 'image.png';
                a.click();
            };
        });
        document.querySelectorAll('.gallery-like').forEach(btn => {
            btn.onclick = () => {
                let span = btn.querySelector('.like-count');
                let likes = parseInt(span.innerText) + 1;
                span.innerText = likes;
            };
        });
    } catch(e) { console.error(e); }
}

async function publishToGallery(author, desc, imageData) {
    if(!author || !desc || !imageData) return false;
    try {
        await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'gallery', author, desc, imageData, date: new Date().toISOString() }) });
        return true;
    } catch(e) { return false; }
}

// ========== ЧАТ ==========
let favoriteMessages = JSON.parse(localStorage.getItem('favoriteMessages') || '[]');
async function loadMessages() {
    try {
        const r = await fetch(APPS_SCRIPT_URL + "?type=chat");
        const msgs = await r.json();
        const cont = document.getElementById('communityPosts');
        if(!cont) return;
        cont.innerHTML = '';
        if(!msgs || !msgs.length) {
            cont.innerHTML = '<div>Нет сообщений</div>';
            return;
        }
        msgs.slice().reverse().forEach(p => {
            if(!p.name || !p.message) return;
            const isFav = favoriteMessages.includes(p.id);
            const d = document.createElement('div');
            d.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
            d.style.padding = '0.5rem';
            d.innerHTML = `<strong>${escapeHtml(p.name)}</strong> <small>${new Date(p.date).toLocaleString()}</small><br>${escapeHtml(p.message)}<div class="message-reactions"><button class="reaction-btn">👍 <span>0</span></button><button class="reaction-btn">❤️ <span>0</span></button><button class="reaction-btn">😂 <span>0</span></button><button class="favorite-btn" data-favorite="${p.id}" style="color:${isFav ? 'gold' : 'var(--text-secondary)'}">⭐ ${isFav ? 'В избранном' : 'В избранное'}</button></div>`;
            cont.appendChild(d);
        });
        document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.onclick = () => { alert("Реакции будут в следующей версии"); };
        });
        document.querySelectorAll('.favorite-btn').forEach(btn => {
            btn.onclick = () => {
                let id = btn.dataset.favorite;
                if(favoriteMessages.includes(id)) {
                    favoriteMessages = favoriteMessages.filter(i => i !== id);
                    btn.style.color = 'var(--text-secondary)';
                    btn.innerHTML = '⭐ В избранное';
                } else {
                    favoriteMessages.push(id);
                    btn.style.color = 'gold';
                    btn.innerHTML = '⭐ В избранном';
                }
                localStorage.setItem('favoriteMessages', JSON.stringify(favoriteMessages));
            };
        });
    } catch(e) { console.error(e); }
}

async function sendMessage(name, msg, media) {
    if(!msg || !msg.trim()) return;
    const cleanMsg = msg.trim().substring(0, 500);
    const cleanName = (name && name.trim()) ? name.trim().substring(0, 50) : "Аноним";
    await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'chat', name: cleanName, message: cleanMsg, media: media || "", date: new Date().toISOString() }) });
}

// ========== ИНИЦИАЛИЗАЦИЯ ==========
function updateRealVisitorCount() {
    let stored = localStorage.getItem('realVisitorCount');
    let lastDate = localStorage.getItem('lastVisitorDate');
    let today = new Date().toDateString();
    if(lastDate !== today) {
        stored = parseInt(stored) || 0;
        stored++;
        localStorage.setItem('realVisitorCount', stored);
        localStorage.setItem('lastVisitorDate', today);
        visitorCount = stored;
    } else {
        visitorCount = parseInt(stored) || 1;
    }
    document.getElementById('visitorCountDisplay').innerText = visitorCount;
}

function startParticles() {
    if(particlesInterval) clearInterval(particlesInterval);
    particlesInterval = setInterval(() => {
        for(let i = 0; i < 3; i++) {
            let particle = document.createElement('div');
            particle.className = 'particle';
            let size = Math.random() * 6 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = Math.random() * 3 + 2 + 's';
            particle.style.setProperty('--moveX', (Math.random() - 0.5) * 100 + 'px');
            particle.style.background = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.3})`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 5000);
        }
    }, 400);
}

function escapeHtml(s) {
    return s ? String(s).replace(/[&<>]/g, function(m) {
        return m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m;
    }) : '';
}

// ========== ОБРАБОТЧИКИ КНОПОК ==========
document.getElementById('publishGalleryBtn')?.addEventListener('click', async () => {
    const author = document.getElementById('galleryName').value.trim();
    const desc = document.getElementById('galleryDesc').value.trim();
    const file = document.getElementById('galleryFile').files[0];
    if(!author || !desc || !file) {
        alert("Заполните всё");
        return;
    }
    const reader = new FileReader();
    reader.onload = async (e) => {
        const success = await publishToGallery(author, desc, e.target.result);
        if(success) {
            alert("Опубликовано!");
            document.getElementById('galleryName').value = '';
            document.getElementById('galleryDesc').value = '';
            document.getElementById('galleryFile').value = '';
            loadGallery();
        } else {
            alert("Ошибка");
        }
    };
    reader.readAsDataURL(file);
});

document.getElementById('publishPostBtn')?.addEventListener('click', async () => {
    const name = document.getElementById('communityName').value;
    const msg = document.getElementById('communityMsg').value;
    const media = document.getElementById('communityMedia').value;
    if(!msg || !msg.trim()) {
        alert("Напишите сообщение!");
        return;
    }
    await sendMessage(name, msg, media);
    document.getElementById('communityMsg').value = '';
    document.getElementById('communityMedia').value = '';
    loadMessages();
});
